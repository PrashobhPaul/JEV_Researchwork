name: facetvec-evaluate

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Corpus config"
        default: "configs/vscode.json"
        required: true
      max_records:
        description: "Records to label (overrides source.max_records)"
        default: "400"
        required: true
      refresh:
        description: "Re-fetch the corpus snapshot"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: facetvec-evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: facetvec
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: facetvec/requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('facetvec/requirements.txt', 'facetvec/configs/**') }}
          restore-keys: hf-

      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run the evaluation
        id: eval
        # leaves time for the commit step, which saves the answer cache even if labelling runs long
        timeout-minutes: 270
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -m facetvec all --config "${{ inputs.config }}" \
            --max-records "${{ inputs.max_records }}" \
            ${{ inputs.refresh && '--refresh' || '' }}

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.eval.outcome }}" = "success" ]; then
            git add data README.md
            msg="eval: $(date -u +%Y-%m-%dT%H:%MZ) ${{ inputs.config }} ${{ inputs.max_records }} records"
          else
            # only the answer cache, so a re-run resumes where this one stopped; no partial results
            git add data/*/decisions.sqlite
            msg="eval (${{ steps.eval.outcome }}, answer cache only): $(date -u +%Y-%m-%dT%H:%MZ) ${{ inputs.config }}"
          fi
          git commit -m "$msg" || echo "nothing to commit"
          # autostash: on a failed run, outputs other than the cache stay unstaged and would block the rebase
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            facetvec/data/**/results.md
            facetvec/data/**/results.json
