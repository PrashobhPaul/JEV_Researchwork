name: data-analyst-tests

on:
  push:
    paths: ["data-analyst/**", ".github/workflows/data-analyst-tests.yml"]
  pull_request:
    paths: ["data-analyst/**", ".github/workflows/data-analyst-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-analyst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install pytest
      - run: pytest -q
