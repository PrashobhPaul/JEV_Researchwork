<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:1200px;height:675px;overflow:hidden;background:#eef1f6;font-family:Inter,sans-serif;color:#0f1e3a}
#c{padding:28px 40px;position:relative;height:675px}
.eb{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;color:#5b6b85;font-weight:600}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 14px}h1 span{color:#1f8f5f}
.q{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#5b6b85;margin:12px 0 6px}.q b{color:#0f1e3a}
.item{background:#fff;border:1px solid #dfe5ef;border-radius:10px;padding:10px 14px;margin-bottom:7px}
.t{font-size:14px;font-weight:600;margin-bottom:6px}
.m{display:inline-block;width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;font-size:12px;margin-right:6px;color:#fff}.m.y{background:#1f8f5f}.m.n{background:#c9d3e3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid #dfe5ef;background:#fafbfd;color:#3d4c66}
.chip.filter{border-color:#bfe3d0;background:#eaf7ef;color:#1f6f4a}.chip.prefer{border-color:#f6d8b0;background:#fff3e0;color:#c2660a}
.chip b{font-weight:600}
.ft{position:absolute;left:40px;right:40px;bottom:14px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a97ab}
</style></head><body><div id="c">
<div class="eb">MATCHED BECAUSE · FUSED RESULTS WITH THE FACET EVIDENCE · $corpus</div>
<h1>Every result can say <span>why</span>. Green chip = the query filtered on it; amber = preferred.</h1>
$cards
<div class="ft"><span>✓ in the labelled truth set · ✗ not — the misses are shown on purpose</span><span>$repo_url</span></div>
</div></body></html>
